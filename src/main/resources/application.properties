spring.application.name=CampusFlow

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campusflow}
spring.datasource.username=${DB_USERNAME:campusflow}
spring.datasource.password=${DB_PASSWORD:campusflow_local}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never