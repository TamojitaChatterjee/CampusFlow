apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../campusflow.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: campusflow
      spec:
        template:
          spec:
            containers:
              - name: campusflow
                image: campusflow-app:latest
                imagePullPolicy: IfNotPresent
